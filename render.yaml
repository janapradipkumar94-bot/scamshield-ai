services:
  # ============================================================
  # 1. FastAPI Machine Learning Backend Service
  # ============================================================
  - type: web
    name: scamshield-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@scamshield.ai
      - key: ADMIN_PASSWORD
        value: AdminSecurePassword123!

  # ============================================================
  # 2. React Vite Frontend Static Site
  # ============================================================
  - type: web
    name: scamshield-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: scamshield-backend
          property: host

